org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.caching=true
# Configuration cache: skips the whole configuration phase on unchanged builds (buildFork's doLast
# captures its project values at configuration time to stay compatible).
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
kotlin.incremental=true
org.gradle.warning.mode=summary

# shiroikuma fork: per-build version tail (bumped by the buildFork task, reset to 1 on upstream sync)
BUILD_NUMBER=17
