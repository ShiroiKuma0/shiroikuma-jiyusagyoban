org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.daemon=true
# Keep build caching local-only; do not configure an untrusted remote cache while Kotlin cache metadata is under advisory review.
org.gradle.caching=true
# Configuration cache: skips the whole configuration phase on unchanged builds (buildFork's doLast
# captures its project values at configuration time to stay compatible).
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
kotlin.incremental=true
org.gradle.warning.mode=summary
android.experimental.enableScreenshotTest=true
android.compose.screenshot.maxHeapSize=4g

# shiroikuma fork: per-build version tail (bumped by the buildFork task).
# It runs MONOTONICALLY and is reset to 1 ONLY when appVersionCode itself moves. Resetting it on a
# sync that did not move appVersionCode sends versionCode (= appVersionCode * 10000 + N) BACKWARDS,
# and versionCode is the only thing an installer compares — the date and sha in versionName are
# cosmetic. buildFork enforces this against LAST_BUILT_VERSION_CODE below.
BUILD_NUMBER=2

# Highest versionCode this repo has ever built; buildFork refuses to go at or below it.
LAST_BUILT_VERSION_CODE=880001
