<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Themed (monochrome) icon layer: same geometry as ruledeck-foreground.svg, one color.
       Each card is cut away where the card in front of it sits, and the rows are holes. -->
  <defs>
    <rect id="card" x="-195" y="-170" width="390" height="340" rx="62"/>
    <g id="rows">
      <circle cx="-112" cy="-56" r="40"/>
      <polyline points="-44,-80 -20,-56 -44,-32" fill="none" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="8" y="-90" width="142" height="68" rx="34"/>
      <circle cx="-112" cy="56" r="40"/>
      <polyline points="-44,32 -20,56 -44,80" fill="none" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="8" y="22" width="142" height="68" rx="34"/>
    </g>
    <mask id="behind-middle" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#FFFFFF"/>
      <use xlink:href="#card" transform="translate(521.5 523.5) rotate(-12)" fill="#000000" stroke="#000000" stroke-width="36"/>
    </mask>
    <mask id="behind-front" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#FFFFFF"/>
      <use xlink:href="#card" transform="translate(565.5 557.5) rotate(-7)" fill="#000000" stroke="#000000" stroke-width="36"/>
    </mask>
    <mask id="row-holes" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#FFFFFF"/>
      <use xlink:href="#rows" transform="translate(565.5 557.5) rotate(-7)" fill="#000000" stroke="#000000"/>
    </mask>
  </defs>
  <g fill="#FFFFFF">
    <g mask="url(#behind-front)">
      <g mask="url(#behind-middle)">
        <use xlink:href="#card" transform="translate(479.5 493.5) rotate(-17)"/>
      </g>
      <use xlink:href="#card" transform="translate(521.5 523.5) rotate(-12)"/>
    </g>
    <g mask="url(#row-holes)">
      <use xlink:href="#card" transform="translate(565.5 557.5) rotate(-7)"/>
    </g>
  </g>
</svg>
